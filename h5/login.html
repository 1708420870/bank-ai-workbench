<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>登录 · 微光银行 · 客户服务</title>
<style>
:root{--ink:#16243d;--ink2:#4a5a72;--ink3:#8b98ad;--line:#e3e9f0;--bg:#f2f5f9;--blue:#2f6df6;--yellow:#fff4d6;--yellowInk:#8a6d3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;
box-shadow:0 10px 30px rgba(22,36,61,.06);overflow:hidden}
.hd{padding:26px 24px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f8fbff,#fff)}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3);letter-spacing:.4px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:14px;font-weight:700}
h1{margin:14px 0 4px;font-size:21px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.demo-tag{font-size:11px;font-weight:500;color:var(--yellowInk);background:var(--yellow);
border:1px solid #f2dfae;border-radius:999px;padding:1px 8px;letter-spacing:0}
.sub{margin:0;font-size:12.5px;color:var(--ink3)}
.bd{padding:22px 24px 10px}
.lbl{font-size:12.5px;color:var(--ink2);margin:0 0 7px;font-weight:600}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 13px;
font-size:15px;color:var(--ink);background:#fbfdff;outline:none;transition:.15s}
input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,109,246,.1)}
.hint{font-size:12px;color:var(--ink3);margin:8px 0 0;line-height:1.6}
.btn{width:100%;height:48px;border:none;border-radius:11px;background:var(--ink);color:#fff;
font-size:15.5px;font-weight:600;letter-spacing:.5px;cursor:pointer;margin-top:18px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);margin-top:10px;font-weight:500}
.err{color:#d9352b;font-size:12.5px;margin-top:10px;min-height:17px}
.ft{padding:16px 24px 20px;border-top:1px solid var(--line);background:#fcfdff;
font-size:11.5px;color:var(--ink3);line-height:1.75}
.ft b{color:var(--ink2);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <div class="brand"><span class="logo">光</span>微光银行 · 客户服务</div>
    <h1>客户登录<span class="demo-tag">演示环境</span></h1>
    <p class="sub">登录后可提交问题，由 AI 客服先行为您解答</p>
  </div>
  <div class="bd">
    <p class="lbl">手机号 / 客户号</p>
    <input id="acct" inputmode="numeric" autocomplete="off" placeholder="请输入手机号或客户号" value="13800138000">
    <p class="hint">演示账号已预填，直接点「登录」即可进入。此环境不校验真实身份，请勿填入真实客户信息。</p>
    <p class="err" id="err"></p>
    <button class="btn" id="go">登 录</button>
    <button class="btn ghost" id="emp">员工登录（坐席 / 管理控制台）</button>
    <p class="hint" style="margin-top:14px">两个入口在登录环节分流：客户账号进客户视图，员工工号进内网控制台。</p>
  </div>
  <div class="ft">
    <b>本页为演示环境，全部客户信息均为合成数据，不含任何真实客户资料</b><br>
    数据不出内网 · AI 只建议不裁决 · 全链路审计
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const EMP_URL = '/emp';   // 由网关转到内网登录页
function fail(m){ $('#err').textContent = m; }

$('#go').onclick = () => {
  const v = ($('#acct').value || '').trim();
  if (!/^\d{6,20}$/.test(v)) { fail('请输入 6-20 位数字的手机号或客户号'); return; }
  localStorage.setItem('fb_openid', 'oPoc-' + v);
  localStorage.setItem('fb_acct', v);
  location.href = '/app';
};
$('#acct').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#emp').onclick = () => { location.href = EMP_URL; };
</script>
</body>
</html>
